<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/foss-united.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- "only light" opts out of Chromium's Auto Dark Theme (Cromite/Chrome on
         Android), which otherwise inverts the kraft-paper palette. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#D4B896" />
    <title>Open Hardware Devroom — IndiaFOSS 2026</title>
    <meta
      name="description"
      content="Talks, demos, and hard-won lessons from the people building open hardware in India. IndiaFOSS 2026, 26-27 Sep, Bengaluru."
    />

    <!-- Social share card. Regenerate the image with:
         node apps/web/scripts/og/render-og.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Hardware Devroom" />
    <meta property="og:title" content="Open Hardware Devroom — IndiaFOSS 2026" />
    <meta
      property="og:description"
      content="Talks, demos, and hard-won lessons from the people building open hardware in India. 26-27 Sep, Bengaluru."
    />
    <meta property="og:url" content="https://devroom.absurd.industries/" />
    <meta property="og:image" content="https://devroom.absurd.industries/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Hardware Devroom, IndiaFOSS 2026, 26-27 Sep, Bengaluru." />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Hardware Devroom — IndiaFOSS 2026" />
    <meta
      name="twitter:description"
      content="Talks, demos, and hard-won lessons from the people building open hardware in India. 26-27 Sep, Bengaluru."
    />
    <meta name="twitter:image" content="https://devroom.absurd.industries/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  </head>
  <body>
    <!-- Torn-edge SVG filters (Ooru ids: referenced by .card-bg / .hero-bg in index.css) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="torn">
        <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="5" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="papercut">
        <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="papercut-2">
        <feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="4" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="papercut-3">
        <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="4" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
